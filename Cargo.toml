[package]
name = "harmcp"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
comfy-table = "7"
regex = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
